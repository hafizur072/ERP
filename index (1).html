<title>Rupa Crafts Ltd – Teaching ERP</title><style>:root{--ink:#241f2b;--bg:#f7f4f8;--line:#d9d2df;--brand:#7a2e65;--gold:#b8892b;--ok:#1d7a4f;--surface:#fff;--head:#efe9f2}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}

.stars{color:var(--gold);letter-spacing:1px}.badge{align-self:flex-start;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700}.badge.ok{background:#dff3e8;color:#14603c}.badge.mid{background:#fdecc8;color:#7a5200}.badge.bad{background:#f9d9d9;color:#8a1c1c}

<body>
<header><h1>Rupa Crafts Ltd <small>Teaching ERP</small></h1>
<span class="hc"><label>Sign in as <select id="role" onchange="setRole(this.value)"></select></label>
<span id="who" style="font-weight:600"></span><button onclick="gOut()">Sign out</button><label>Accent <select id="acsel" onchange="setAccent(this.value)" aria-label="Accent colour"></select></label><label>Background <select id="bgsel" onchange="setBg(this.value)" aria-label="Background colour"></select></label><button id="tb" onclick="toggleTheme()" aria-label="Switch between light and dark theme" title="Light or dark">Theme</button><button onclick="backup()" title="Download all data as a file">Backup</button><button onclick="document.getElementById('rf').click()" title="Load a backup file">Restore</button><input type="file" id="rf" accept=".json,application/json" hidden onchange="restore(this)">
<button id="rb" onclick="resetData()">Reset data</button></span></header>
<nav id="nav"></nav><main id="main"></main><div id="msg" role="status" hidden></div>
<script>/* core.js – data layer, audit trail, approval hooks, posting engine, weighted-average stock costing */
const KEY='sme_erp_v1', VAT=0.15, APPROVAL_LIMIT=50000;      // documents above this need the Owner
const ROLES=['Owner','Accountant','Sales Officer','Store Keeper','Auditor'];
let DB, USER={role:'Accountant'};
const $=s=>document.querySelector(s);
const r2=n=>Math.round(n*100)/100;
const fmt=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const clone=o=>JSON.parse(JSON.stringify(o));
const get=(c,id)=>DB[c].find(x=>x.id===id);
const prod=id=>get('products',id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}};
function guard(){ if(USER.role==='Auditor') throw new Error('Auditors have read-only access.'); }
function next(p){ DB.seq[p]=(DB.seq[p]||0)+1; return p+'-'+String(DB.seq[p]).padStart(4,'0'); }
/* AUDIT TRAIL: every create/edit/delete records who (role), when, old and new values */
function log(action,entity,id,o,n){ DB.audit.push({t:new Date().toLocaleString(),user:USER.role,action,entity,id,old:o?JSON.stringify(o):'',nw:n?JSON.stringify(n):''}); }
function create(coll,obj,pre){ guard(); clean(obj); obj.id=next(pre); DB[coll].push(obj); log('CREATE',coll,obj.id,null,obj); save(); return obj; }
function update(coll,id,patch){ guard(); clean(patch); const d=get(coll,id), old={}; Object.keys(patch).forEach(k=>old[k]=d[k]); Object.assign(d,patch); log('EDIT',coll,id,old,patch); save(); return d; }
function remove(coll,id){ guard(); const i=DB[coll].findIndex(x=>x.id===id); log('DELETE',coll,id,DB[coll][i],null); DB[coll].splice(i,1); save(); }
/* APPROVAL HOOK: only the Owner may approve */
const limit=()=>(DB.company&&DB.company.approvalLimit!=null)?DB.company.approvalLimit:APPROVAL_LIMIT;
function needsApproval(amount){ return amount>limit(); }
function requireOwner(){ if(USER.role!=='Owner') throw new Error('Only the Owner can approve. Switch role to Owner.'); }
/* POSTING ENGINE: double entry, must balance; src links back to the source document */
function post(date,memo,lines,src){
  guard(); const dr=r2(lines.reduce((s,l)=>s+l[1],0)), cr=r2(lines.reduce((s,l)=>s+l[2],0));
  if(Math.abs(dr-cr)>0.005) throw new Error('Entry not balanced: Dr '+fmt(dr)+' vs Cr '+fmt(cr));
  const e={id:next('JV'),date,memo,lines:lines.map(l=>[l[0],r2(l[1]),r2(l[2])]),src}; DB.journal.push(e); log('CREATE','journal',e.id,null,e); save(); return e;
}
/* STOCK: perpetual inventory, weighted average cost */
function moveStock(p,type,qty,cost,src,bq,ba){
  const old={qty:p.qty,avg:p.avg}; p.qty=bq; p.avg=Math.round(ba*10000)/10000;
  DB.stock.push({date:today(),pid:p.id,type,qty,cost:r2(cost),bq,ba:p.avg,src}); log('EDIT','products',p.id,old,{qty:p.qty,avg:p.avg});
}
function receiveStock(pid,qty,cost,src){ const p=prod(pid), q=p.qty+qty; moveStock(p,'IN',qty,cost,src,q,(p.qty*p.avg+qty*cost)/q); }
function issueStock(pid,qty,src){ const p=prod(pid); if(p.qty<qty) throw new Error('Insufficient stock for '+p.name+' (available '+p.qty+').'); const c=p.avg; moveStock(p,'OUT',qty,c,src,p.qty-qty,p.avg); return c; }
function seed(){
  DB={seq:{},audit:[],journal:[],stock:[],quotes:[],orders:[],invoices:[],receipts:[],pos:[],grns:[],payments:[],
   accounts:[['1010','Cash'],['1020','Bank'],['1100','Accounts Receivable'],['1200','Inventory'],['1210','VAT Input (recoverable)'],['2010','Accounts Payable'],['2100','VAT Output Payable'],['3010','Owner Capital'],['4010','Sales Revenue'],['5010','Cost of Goods Sold'],['5100','Salaries Expense'],['5200','Rent Expense'],['5300','Utilities Expense']],
   customers:[{id:'C01',name:'Nusrat Boutique'},{id:'C02',name:'Farzana Rahman'},{id:'C03',name:'Dhaka Bridal House'}],
   suppliers:[{id:'S01',name:'Chawkbazar Wholesalers'},{id:'S02',name:'Shankhari Bazar Traders'}],
   products:[{id:'P01',name:'Gold-plated Necklace Set',price:1800,avg:900,qty:40,reorder:10},{id:'P02',name:'Jhumka Earrings',price:650,avg:300,qty:60,reorder:20},
    {id:'P03',name:'Glass Bangles (dozen)',price:450,avg:200,qty:30,reorder:15},{id:'P04',name:'Kundan Bridal Set',price:5200,avg:2800,qty:12,reorder:5},{id:'P05',name:'Hair Clip Pack',price:220,avg:90,qty:100,reorder:30}]};
  let inv=0; DB.products.forEach(p=>{inv+=p.qty*p.avg; DB.stock.push({date:today(),pid:p.id,type:'OPEN',qty:p.qty,cost:p.avg,bq:p.qty,ba:p.avg,src:'Opening'});});
  DB.journal.push({id:next('JV'),date:today(),memo:'Opening balances',lines:[['1010',300000,0],['1200',inv,0],['3010',0,300000+inv]],src:{doc:'Opening'}});
  save();
}
const COLLS=['audit','journal','stock','quotes','orders','invoices','receipts','pos','grns','payments','accounts','customers','suppliers','products','employees','attendance','payroll','webOrders','shipments','gateway','reviews','messages','campaigns','shareholders','resolutions','assets','depMonths'];
/* load saved data, but never trust it: unusable data is replaced by fresh seed data, and any missing list is added */
function load(){ let s=null; try{s=localStorage.getItem(KEY);}catch(e){}
  try{ DB=s?JSON.parse(s):null; }catch(e){ DB=null; }
  if(!DB||typeof DB!=='object'||Array.isArray(DB)||!Array.isArray(DB.products)||!Array.isArray(DB.accounts)||!Array.isArray(DB.journal)||!DB.journal.length) return seed();
  if(!DB.seq||typeof DB.seq!=='object') DB.seq={};
  COLLS.forEach(c=>{ if(!Array.isArray(DB[c])) DB[c]=[]; }); }
function resetData(){ const b=$('#rb'); if(USER.role!=='Owner') return toast('Only the Owner can reset data. Switch role to Owner.'); if(!window._rc){ toast('Click the button again within 4 seconds to erase all data and start fresh.'); window._rc=1; b.textContent='Click again to confirm'; b.style.background='#a22'; b.style.borderColor='#a22'; setTimeout(()=>{ window._rc=0; b.textContent='Reset data'; b.style.background=''; b.style.borderColor=''; },4000); return; } window._rc=0; b.textContent='Reset data'; b.style.background=''; b.style.borderColor=''; seed(); migrate(); migrateEcom(); migrateEbiz(); migrateCo(); SEL.msg=''; SEL.cmpView=''; SEL.cmp.body=''; CART=[]; SEL.slip=null; SEL.trk=null; SEL.wi=null; render(); toast('Data reset.'); }

/* modules.js – screens for Sales, Purchasing, Inventory, Accounting, Reports, Audit Log */
const TABS=['Sales','Purchasing','Inventory','Accounting','Reports','Audit Log'];
let TAB='Sales', SEL={cust:'C01',sup:'S01',prod:'P01',acct:'1010'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const why=t=>`<div class="why"><b>Why this matters:</b> ${t}</div>`;
const tbl=(h,rows)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.length?rows.map(r=>`<tr${r.cls?` class="${r.cls}"`:''}>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}">Nothing here yet.</td></tr>`}</table>`;
const sel=(id,o,cur,oc)=>`<select id="${id}" ${oc?`onchange="${oc}"`:''}>${o.map(x=>`<option value="${x[0]}" ${x[0]==cur?'selected':''}>${x[1]}</option>`).join('')}</select>`;
const v=id=>$('#'+id).value;
const custs=()=>DB.customers.filter(c=>USER.role!=='Customer'||!USER.cust||c.id===USER.cust).map(c=>[c.id,c.name]), sups=()=>DB.suppliers.filter(c=>USER.role!=='Supplier'||!USER.sup||c.id===USER.sup).map(c=>[c.id,c.name]), prods=()=>DB.products.map(p=>[p.id,p.name+' (stock '+p.qty+')']);
const accts=()=>DB.accounts.map(a=>[a[0],a[0]+' '+a[1]]);
function toast(m){ const t=$('#msg'); t.textContent=m; t.hidden=false; clearTimeout(window._t); window._t=setTimeout(()=>t.hidden=true,5000); }
function run(fn){ try{fn();}catch(e){toast(e.message);} render(); }
function bal(code){ let b=0; DB.journal.forEach(e=>e.lines.forEach(l=>{ if(l[0]===code) b+=l[1]-l[2]; })); return b; }
/* ledger with running balance; sign=1 for debit-nature (AR), -1 for credit-nature (AP); party filters the sub-ledger */
function ledger(code,party,sign){ let run=0; const rows=[];
  DB.journal.forEach(e=>e.lines.forEach(l=>{ if(l[0]===code&&(!party||e.src.party===party)){ run+=sign*(l[1]-l[2]); rows.push([e.date,e.id,e.src.doc||'',esc(e.memo),fmt(l[1]),fmt(l[2]),fmt(run)]); } }));
  return tbl(['Date','Journal','Source document','Memo','Debit','Credit','Balance'],rows); }
const mk=(pid,qty,price)=>{ const net=r2(qty*price), vat=r2(net*VAT); return {date:today(),pid,qty,price,net,vat,total:r2(net+vat)}; };

/* ---------- SALES: order-to-cash ---------- */
function newQuote(){ run(()=>create('quotes',{...mk(v('pr'),+v('qt'),prod(v('pr')).price),cust:v('cu'),status:'Open'},'QT')); }
function delQuote(id){ run(()=>remove('quotes',id)); }
function toOrder(id){ run(()=>{ const q=get('quotes',id), {id:_,status:__,...d}=q; update('quotes',id,{status:'Converted'}); create('orders',{...d,ref:id,status:'Open'},'SO'); }); }
function toInvoice(id){ run(()=>{ const o=get('orders',id), {id:_,status:__,...d}=o;
  if(prod(o.pid).qty<o.qty) throw new Error('Insufficient stock to invoice. Raise a purchase order first.');
  const pend=needsApproval(o.total); update('orders',id,{status:'Invoiced'});
  const inv=create('invoices',{...d,ref:id,paid:0,status:pend?'Pending Approval':'Approved'},'INV'); if(!pend) issueInvoice(inv.id); }); }
function approveInv(id){ run(()=>{ requireOwner(); const i=get('invoices',id); if(prod(i.pid).qty<i.qty) throw new Error('Insufficient stock.'); update('invoices',id,{status:'Approved'}); issueInvoice(id); }); }
function issueInvoice(id){ const i=get('invoices',id), c=r2(issueStock(i.pid,i.qty,id)*i.qty);   // revenue + VAT + cost of goods sold, one balanced entry
  post(i.date,'Sales invoice '+id,[['1100',i.total,0],[SALES_ACCT[i.channel]||'4010',0,i.net],['2100',0,i.vat],['5010',c,0],['1200',0,c]],{doc:id,party:i.cust}); }
function receivePay(id){ run(()=>{ const i=get('invoices',id), due=r2(i.total-i.paid), a=r2(+v('rp-'+id)); if(!(a>0&&a<=due)) throw new Error('Enter an amount between 0 and '+fmt(due));
  const r=create('receipts',{inv:id,cust:i.cust,amt:a,date:today()},'RC'); update('invoices',id,{paid:r2(i.paid+a)}); post(today(),'Receipt '+r.id+' for '+id,[['1010',a,0],['1100',0,a]],{doc:r.id,party:i.cust}); }); }

/* ---------- PURCHASING: procure-to-pay ---------- */
function newPO(){ run(()=>{ const d=mk(v('pp'),+v('pq'),+v('pc')); create('pos',{...d,sup:v('su'),cost:d.price,paid:0,status:needsApproval(d.total)?'Pending Approval':'Approved'},'PO'); }); }
function approvePO(id){ run(()=>{ requireOwner(); update('pos',id,{status:'Approved'}); }); }
function receiveGRN(id){ run(()=>{ const o=get('pos',id), g=create('grns',{po:id,sup:o.sup,pid:o.pid,qty:o.qty,date:today()},'GRN');
  receiveStock(o.pid,o.qty,o.cost,g.id); update('pos',id,{status:'Received'});
  post(today(),'Goods received '+g.id+' (PO '+id+')',[['1200',o.net,0],['1210',o.vat,0],['2010',0,o.total]],{doc:g.id,party:o.sup}); }); }
function paySup(id){ run(()=>{ const o=get('pos',id), due=r2(o.total-o.paid), a=r2(+v('pay-'+id)); if(!(a>0&&a<=due)) throw new Error('Enter an amount between 0 and '+fmt(due));
  const p=create('payments',{po:id,sup:o.sup,amt:a,date:today()},'PAY'); update('pos',id,{paid:r2(o.paid+a)}); post(today(),'Payment '+p.id+' for '+id,[['2010',a,0],['1010',0,a]],{doc:p.id,party:o.sup}); }); }
function postManual(){ run(()=>{ const a=r2(+v('ma')); if(!(a>0)) throw new Error('Enter an amount.'); if(v('md')===v('mc')) throw new Error('Debit and credit accounts must differ.');
  if(needsApproval(a)) requireOwner(); post(today(),v('mm')||'Manual journal',[[v('md'),a,0],[v('mc'),0,a]],{doc:'Manual'}); }); }

function migrate(){ ['employees','attendance','payroll'].forEach(c=>{ if(!DB[c]) DB[c]=[]; });
  NEW_ACCTS.forEach(a=>{ if(!DB.accounts.some(x=>x[0]===a[0])) DB.accounts.push(a); }); DB.accounts.sort((a,b)=>a[0]<b[0]?-1:1);
  if(!DB.employees.length) SEED_EMP.forEach(e=>DB.employees.push({id:e[0],name:e[1],designation:e[2],dept:e[3],basic:e[4],house:e[5],medical:e[6],transport:e[7],status:'Active'})); save(); }
function hrGuard(){ guard(); if(!['Owner','Accountant','HR Officer'].includes(USER.role)) throw new Error('Only the HR Officer, Accountant or Owner can do this.'); }
function calcPay(e,at){ const gross=e.basic+e.house+e.medical+e.transport, ab=at?at.absent:0, ot=at?at.ot:0;
  const absDed=r2(gross/30*ab), otPay=r2(ot*(e.basic/208)*2), earn=r2(gross-absDed+otPay), pfE=r2(e.basic*PF_RATE), tax=r2(Math.max(0,gross-TAX_FREE)*TAX_RATE);
  return {gross,absDed,otPay,earn,pfE,pfR:pfE,tax,net:r2(earn-pfE-tax)}; }
function saveAtt(){ run(()=>{ hrGuard(); const e=v('ae'), m=v('am'), ab=Math.min(30,+v('aa')), ot=+v('ao'); if(!m) throw new Error('Choose a month.');
  if(DB.payroll.some(p=>p.month===m)) throw new Error('Payroll for '+m+' is already prepared. Attendance is locked.');
  const x=DB.attendance.find(a=>a.emp===e&&a.month===m); x?update('attendance',x.id,{absent:ab,ot}):create('attendance',{emp:e,month:m,absent:ab,ot},'AT'); }); }
function prepareRun(){ run(()=>{ hrGuard(); const m=v('pm'); if(!m) throw new Error('Choose a month.'); if(DB.payroll.some(p=>p.month===m)) throw new Error('Payroll for '+m+' already exists.');
  DB.employees.filter(e=>e.status==='Active').forEach(e=>create('payroll',{month:m,emp:e.id,...calcPay(e,DB.attendance.find(a=>a.emp===e.id&&a.month===m)),preparedBy:USER.role,status:'Draft'},'PR')); }); }
const runSum=(m,k)=>r2(DB.payroll.filter(p=>p.month===m).reduce((s,p)=>s+p[k],0));

  post(today(),'Payroll accrual '+m,[['5100',runSum(m,'earn'),0],['5110',runSum(m,'pfR'),0],['2030',0,runSum(m,'net')],['2040',0,runSum(m,'tax')],['2050',0,r2(runSum(m,'pfE')+runSum(m,'pfR'))]],{doc:'PAYROLL-'+m});
  rs.forEach(p=>update('payroll',p.id,{status:'Approved'})); }); }
function payRun(m){ run(()=>{ hrGuard(); if(USER.role==='HR Officer') throw new Error('The HR Officer prepares payroll; the Accountant or Owner pays it (segregation of duties).');
  const rs=DB.payroll.filter(p=>p.month===m&&p.status==='Approved'); if(!rs.length) throw new Error('Approve the run first.');
  post(today(),'Salary payment '+m,[['2030',runSum(m,'net'),0],['1010',0,runSum(m,'net')]],{doc:'PAYROLL-'+m+'-PAY'}); rs.forEach(p=>update('payroll',p.id,{status:'Paid'})); }); }

/* mis.js – role-based MIS dashboards, exception report and a what-if decision tool. Reads data only; never posts. */
SEL.dash='Owner';
const rev=()=>-(bal('4010')+bal('4020')+bal('4030')), cogs=()=>bal('5010'), expenses=()=>DB.accounts.filter(a=>a[0][0]==='5').reduce((s,a)=>s+bal(a[0]),0);

function ageing(){ const b={'0-30 days':0,'31-60 days':0,'Over 60 days':0}; okInv().forEach(i=>{ const due=r2(i.total-i.paid); if(due<0.005) return; const d=(Date.now()-new Date(i.date))/864e5; b[d<=30?'0-30 days':d<=60?'31-60 days':'Over 60 days']+=due; }); return Object.entries(b); }
function topBy(f){ const m={}; okInv().forEach(i=>{ const k=f(i); m[k]=(m[k]||0)+i.net; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5); }

/* exception report: items management should look at */
function exceptions(){ const x=[], seen={};
  DB.invoices.filter(i=>i.status==='Pending Approval').forEach(i=>x.push('Invoice '+i.id+' waits for Owner approval (BDT '+fmt(i.total)+').'));
  DB.pos.filter(o=>o.status==='Pending Approval').forEach(o=>x.push('Purchase order '+o.id+' waits for Owner approval.'));
  okInv().forEach(i=>{ const due=r2(i.total-i.paid), d=(Date.now()-new Date(i.date))/864e5; if(due>0.004&&d>30) x.push('Invoice '+i.id+' is '+Math.floor(d)+' days old with BDT '+fmt(due)+' unpaid.'); const k=[i.cust,i.pid,i.qty,i.date].join('|'); if(seen[k]) x.push('Possible duplicate: '+i.id+' looks the same as '+seen[k]+'.'); else seen[k]=i.id; });
  DB.products.filter(p=>p.qty<=p.reorder).forEach(p=>x.push(p.name+' is at or below its reorder level ('+p.qty+' left).'));
  DB.journal.filter(e=>e.src.doc==='Manual'&&e.lines.some(l=>Math.max(l[1],l[2])>0.9*limit()&&Math.max(l[1],l[2])<=limit())).forEach(e=>x.push('Manual journal '+e.id+' sits just under the approval limit.'));
  DB.payroll.filter(p=>p.status==='Draft').length&&x.push('A payroll run is prepared but not yet approved.');
  DB.messages.filter(m=>m.status==='New').length&&x.push(DB.messages.filter(m=>m.status==='New').length+' customer message(s) on Facebook or WhatsApp are waiting to be converted to orders.');
  DB.pos.filter(late).forEach(o=>x.push('Supplier delivery for '+o.id+' is late (promised '+shipOf(o).eta+').')); return x; }
function runWhatIf(){ run(()=>{ SEL.wi={pid:v('wp'),pp:+v('wpp'),vp:+v('wvp')}; }); }

const shipOf=o=>o.ship||{status:'Not confirmed',eta:'',ref:'',done:'',events:[]};
const late=o=>{ const s=shipOf(o); return o.status==='Approved'&&s.status!=='Delivered'&&!!s.eta&&s.eta<today(); };
const payState=o=>o.status!=='Received'?'Not due yet':o.paid<0.005?'Unpaid':o.total-o.paid>0.004?'Part paid':'Paid';
/* only a signed-in supplier moves its own order forward: Not confirmed, Confirmed, Dispatched, Delivered */
function supStep(id,to){ run(()=>{ if(USER.role!=='Supplier') throw new Error('Only the supplier updates delivery status. Switch role to Supplier.');
  guard(); const o=get('pos',id), s=shipOf(o), from={Confirmed:'Not confirmed',Dispatched:'Confirmed',Delivered:'Dispatched'}[to];
  if(o.sup!==SEL.supUser) throw new Error('This order belongs to another supplier.');
  if(o.status!=='Approved') throw new Error('Only approved purchase orders can be updated.');
  if(s.status!==from) throw new Error('This order is already '+s.status.toLowerCase()+'.');
  let eta=s.eta, ref=s.ref, msg;
  if(to==='Confirmed'){ eta=v('eta-'+id); if(!eta) throw new Error('Enter the delivery date you promise.'); if(eta<today()) throw new Error('The delivery date cannot be in the past.'); msg='Supplier confirmed the order, delivery promised for '+eta; }
  if(to==='Dispatched'){ ref=v('ref-'+id).trim(); if(ref.length<2) throw new Error('Enter the truck or courier number.'); msg='Goods dispatched, vehicle '+ref; }
  if(to==='Delivered') msg='Supplier marked the goods as delivered';
  update('pos',id,{ship:{status:to,eta,ref,done:to==='Delivered'?today():'',events:[...s.events,{t:new Date().toLocaleString(),s:msg}]}}); toast('Order '+id+': '+to.toLowerCase()+'.'); }); }

/* =====================================================================================================
   2. SOCIAL ORDER CAPTURE – a chat message is read by simple rules and becomes a sales order
   ===================================================================================================== */
const KEYS={P01:['necklace','nacklace','necklase','haar'],P02:['jhumka','jhumkas','earring','earrings','ear ring'],P03:['bangle','bangles','churi','chudi'],P04:['bridal','kundan'],P05:['hair clip','hair clips','clip','clips']};
const NUMW={ek:1,one:1,dui:2,du:2,two:2,tin:3,three:3,char:4,four:4,pach:5,panch:5,five:5,ten:10};
/* reads the text clause by clause: finds a product word, then the number just before (or just after) it */
function parseMsg(text){ const t=' '+text.toLowerCase().replace(/[^a-z0-9\s.,;&+\n:\-]/g,' ')+' ', lines=[];
  const num=s=>/^\d+$/.test(s)?+s:NUMW[s];
  t.split(/[,.;\n&+]|\band\b|\bar\b/).forEach(cl=>DB.products.forEach(p=>{
    const own=p.name.toLowerCase().split(/[^a-z]+/).filter(w=>w.length>5&&!['plated','dozen'].includes(w)), hit=(KEYS[p.id]||own).find(w=>cl.includes(w));
    if(!hit||lines.some(l=>l.pid===p.id)) return;
    const i=cl.indexOf(hit), before=cl.slice(0,i).trim().split(/\s+/).slice(-4).reverse(), after=cl.slice(i+hit.length).trim().split(/\s+/).slice(0,3);
    let q=null; for(const w of before){ const n=num(w.replace(/x$/,'')); if(n){ q=n; break; } } if(!q) for(const w of after){ const n=num(w.replace(/^x/,'')); if(n){ q=n; break; } }
    lines.push({pid:p.id,qty:q||1}); }));
  const pm=/\bbkash\b/.test(t)?'bKash':/\bnagad\b/.test(t)?'Nagad':/\bcod\b|cash on delivery/.test(t)?'COD':/bank transfer/.test(t)?'Bank transfer':/\bcard\b/.test(t)?'Card':'';
  const a=text.match(/address\s*[:\-]\s*([^\n]+)/i), address=a?a[1].replace(/\s*(?:[.]\s*)?(?:bkash|nagad|cod|bank|cash)[\s\S]*$/i,'').replace(/[.\s]+$/,''):'';
  return {lines,pay:pm,address}; }
function addMsg(){ run(()=>{ ebizGuard(); const f=v('nmn').trim(), t=v('nmt').trim(); if(f.length<2||t.length<5) throw new Error('Enter the sender name and the message text.');
  SEL.msg=create('messages',{date:today(),channel:v('nmc'),from:f,phone:v('nmp').trim(),text:t,status:'New',orders:[]},'MSG').id; }); }
function ignoreMsg(id){ run(()=>{ ebizGuard(); update('messages',id,{status:'Ignored'}); SEL.msg=''; }); }
/* one sales order per product line, exactly like a website checkout; channel 'facebook' posts revenue to account 4020 */
function captureOrder(id){ run(()=>{ ebizGuard(); const m=get('messages',id); if(m.status!=='New') throw new Error('This message was already handled.');
  const lines=parseMsg(m.text).lines.map(l=>({pid:l.pid,qty:Math.floor(+v('mq-'+l.pid))})).filter(l=>l.qty>0); if(!lines.length) throw new Error('Enter a quantity for at least one product.');
  const addr=v('ma').trim(); if(addr.length<5) throw new Error('Enter the delivery address.');
  const phone=v('mph').trim(), agreed=$('#mmc').checked; let cust=v('mc');
  if(cust==='NEW') cust=create('customers',{name:m.from,phone,email:'',type:'B2C',consent:agreed},'C').id;
  else { const c=get('customers',cust), patch={}; if(!c.phone&&phone) patch.phone=phone; if(agreed&&c.consent!==true) patch.consent=true; if(Object.keys(patch).length) update('customers',cust,patch); }
  const ids=lines.map(l=>create('orders',{...mk(l.pid,l.qty,prod(l.pid).price),cust,channel:'facebook',source:m.channel,msg:m.id,address:addr,pay:v('mp'),status:'Open'},'SO').id);
  update('messages',id,{status:'Converted',orders:ids}); SEL.msg=''; toast('Created '+ids.join(', ')+'. Next: issue the invoice.'); }); }
VIEWS['Social Orders']=()=>{ const cn=id=>get('customers',id).name, m=get('messages',SEL.msg), waiting=DB.messages.filter(x=>x.status==='New').length, conv=DB.messages.filter(x=>x.status==='Converted').length,
  soc=-bal('4020'), all=-(bal('4010')+bal('4020')+bal('4030')), social=DB.orders.filter(o=>o.channel==='facebook'); let detail='';
 if(m){ const p=parseMsg(m.text), known=DB.customers.find(c=>c.name.toLowerCase()===m.from.toLowerCase());

    +`<div class="form">Customer ${sel('mc',[...(known?[]:[['NEW','New customer: '+m.from]]),...custs()],known?known.id:'NEW')}<input id="mph" placeholder="Phone or WhatsApp number" value="${esc(m.phone||'')}" aria-label="Phone"><input id="ma" placeholder="Delivery address" value="${esc(p.address)}" style="min-width:260px" aria-label="Delivery address"><input id="mp" placeholder="Payment method" value="${p.pay}" aria-label="Payment method"></div>`

 return why('Social commerce (F-commerce). Many Bangladeshi SMEs sell through a Facebook page or WhatsApp, and the order stays inside a chat thread until someone re-types it into a notebook or sheet. That is slow and error-prone. Here the message becomes a sales order in the same database as the shop and the website: one customer record, one stock, one ledger, with revenue shown separately in account 4020. A person still checks what the system understood (human in the loop), and customer consent is captured at the moment of the order.'+tag('Social commerce','Omnichannel integration','B2C','Order-to-cash','Value chain: marketing and sales'))

  +'<h3>Social sales orders</h3><p>Orders waiting here are invoiced with one click. Payment is received in the Sales tab.</p>'+tbl(['Order','Date','Customer','Item','Platform','Total incl. VAT','Status',''],social.map(o=>[o.id,o.date,esc(cn(o.cust)),esc(prod(o.pid).name)+' x'+o.qty,o.source||'Facebook',fmt(o.total),o.status,o.status==='Open'?`<button onclick="toInvoice('${o.id}')">Issue invoice</button>`:'']))
  +`<h3>Receive a new message (simulation)</h3><div class="form">${sel('nmc',[['Facebook','Facebook Messenger'],['WhatsApp','WhatsApp']])}<input id="nmn" placeholder="Sender name" aria-label="Sender name"><input id="nmp" placeholder="Phone" aria-label="Phone"></div><textarea id="nmt" aria-label="Message text" placeholder="Example: 3 ta bangle lagbe. Address: House 5, Mirpur 2. bKash."></textarea><div class="form"><button onclick="addMsg()">Receive message</button></div>`; };

/* one row per customer: orders, spend, last order date, channels and product categories bought */
function custStats(){ const inv=okInv(); return DB.customers.map(c=>{ const mine=inv.filter(i=>i.cust===c.id), last=mine.map(i=>i.date).sort().pop()||'';
  return {c,n:mine.length,spend:r2(mine.reduce((s,i)=>s+i.total,0)),last,days:last?Math.floor((Date.now()-new Date(last))/864e5):null,ch:[...new Set(mine.map(i=>i.channel||'shop'))],cats:[...new Set(mine.map(i=>prod(i.pid).category||'Other'))]}; }); }
const SEGS={all:['Everyone',()=>true],vip:['VIP: spent BDT '+fmt(VIP_LIMIT)+' or more',s=>s.spend>=VIP_LIMIT],repeat:['Repeat buyers (2 or more orders)',s=>s.n>=2],first:['First-time buyers (1 order)',s=>s.n===1],
 dormant:['Dormant: no order for over '+DORMANT_DAYS+' days',s=>s.n>0&&s.days>DORMANT_DAYS],leads:['Leads: registered, never bought',s=>s.n===0],bridal:['Bridal set buyers',s=>s.cats.includes('Bridal sets')],

const TPL={festival:['Festival offer','Dear {name}, {shop} wishes you a joyful festival! Enjoy {offer} off all jewellery this week. Shop now: {link}'],
 winback:['Win-back','Dear {name}, we miss you at {shop}! Here is {offer} off your next order. Order now: {link}'],
 bridal:['Bridal season','Dear {name}, wedding season is here. See our new Kundan Bridal Sets with {offer} off. Details: {link}'],
 thanks:['Thank you','Thank you {name} for your order at {shop}! Share a photo on our Facebook page and get a surprise gift. {link}'],
 b2b:['Wholesale rates','Dear {name}, new wholesale rates for resellers this month: {offer} off orders above BDT 20,000. Details: {link}']};
const fill=(t,c,offer)=>t.replace(/\{name\}/g,c.name).replace(/\{shop\}/g,'Rupa Crafts').replace(/\{offer\}/g,offer||'10%').replace(/\{link\}/g,'rupacrafts.example/offer');
/* who can really be reached: in the segment, agreed to receive offers, and has the contact detail this channel needs */
function plan(){ const c=SEL.cmp, mem=custStats().filter(SEGS[c.seg][1]), need=s=>c.ch==='Email'?s.c.email:s.c.phone, ok=mem.filter(s=>s.c.consent===true&&need(s));
  const pv=ok.length?fill(c.body,ok[0].c,c.offer):'', parts=c.ch==='SMS'?Math.max(1,Math.ceil(pv.length/160)):1;
  return {mem,ok,pv,parts,cost:ok.length?r2(FIXED[c.ch]+ok.length*COST[c.ch]*parts):0,noConsent:mem.filter(s=>s.c.consent!==true).length,noContact:mem.filter(s=>s.c.consent===true&&!need(s)).length}; }
function cmpSet(k,val){ const c=SEL.cmp; c[k]=val; if(k==='tpl') c.body=TPL[val][1]; if(k==='seg'&&val==='b2b'&&c.tpl!=='b2b'){ c.tpl='b2b'; c.body=TPL.b2b[1]; } render(); }
function toggleConsent(id){ run(()=>{ ebizGuard(); update('customers',id,{consent:get('customers',id).consent!==true}); }); }
function sendCampaign(){ run(()=>{ ebizGuard(); const c=SEL.cmp, p=plan(); if(c.name.trim().length<3) throw new Error('Give the campaign a name.'); if(c.body.trim().length<10) throw new Error('Write the message text.');
  if(!p.ok.length) throw new Error('Nobody in this segment can be reached. Customers need marketing consent and a contact detail.');
  const camp=create('campaigns',{name:c.name.trim(),ch:c.ch,seg:c.seg,segName:SEGS[c.seg][0],body:c.body,offer:c.offer,date:today(),recips:p.ok.map(s=>s.c.id),cost:p.cost,inv0:DB.seq.INV||0},'CMP');
  post(today(),'Campaign cost '+camp.id+' ('+c.ch+')',[['5400',p.cost,0],['1010',0,p.cost]],{doc:camp.id});   // marketing spend reaches the ledger
  SEL.cmpView=camp.id; c.name=''; toast('Campaign '+camp.id+' sent to '+p.ok.length+' customers. Cost BDT '+fmt(p.cost)+' posted to account 5400.'); }); }
/* simulated results: repeatable, so every student sees the same numbers. Real results would come from the email or SMS provider */
function outcome(camp,cid){ const h=k=>hsh(camp.id+cid+k), P={Email:[.95,.45,.27],SMS:[.97,0,.08],WhatsApp:[.95,.8,.25]}[camp.ch], del=h('d')<P[0], op=del&&camp.ch!=='SMS'&&h('o')<P[1], cl=camp.ch==='SMS'?del&&h('c')<P[2]:op&&h('c')<P[2];

/* orders by recipients after the send: a simple attribution rule (it shows association, not proof of cause) */

VIEWS.Campaigns=()=>{ const c=SEL.cmp; if(!c.body) c.body=TPL[c.tpl][1]; const st=custStats(), p=plan(), yes=n=>n?'Yes':'No', ch={shop:'Shop',facebook:'Facebook or WhatsApp',web:'Website'};
 const results=DB.campaigns.map(k=>{ const o=k.recips.map(r=>outcome(k,r)), a=attributed(k); return [k.id,esc(k.name),k.ch,esc(k.segName),k.recips.length,o.filter(x=>x.del).length,k.ch==='SMS'?'-':o.filter(x=>x.op).length,o.filter(x=>x.cl).length,fmt(k.cost),a.n,fmt(a.rev),k.cost?fmt(a.rev/k.cost):'-',`<button onclick="SEL.cmpView='${k.id}';render()">Details</button>`]; });
 const cv=get('campaigns',SEL.cmpView), detail=cv?`<h3>${cv.id}: recipients and results</h3><p>Message sent: ${esc(cv.body)}</p>`+tbl(['Customer','Contact','Delivered','Opened or read','Clicked','Ordered since'],cv.recips.map(r=>{ const cu=get('customers',r), o=outcome(cv,r); return [esc(cu.name),esc(cv.ch==='Email'?cu.email:cu.phone),yes(o.del),cv.ch==='SMS'?'-':yes(o.op),yes(o.cl),yes(attributed(cv).custs.includes(r))]; })):'';
 return why('Customer relationship management (CRM). A firm earns more by keeping and growing customers than by only finding new ones. Segmentation turns Sales data into groups: how recently, how often and how much a customer buys (the RFM idea), and through which channel. Permission marketing: only customers who agreed to receive offers are contacted, which is both a legal and a trust matter. Campaign cost posts to account 5400, and orders by recipients after the send are tracked, which closes the loop between marketing and accounting. Caution: an order after a campaign is not proof that the campaign caused it.'+tag('CRM','Customer segmentation','RFM','Permission marketing and privacy','Analytical CRM','Value chain: marketing and sales'))
  +`<div class="kpis">${kpi('Customers',DB.customers.length)}${kpi('Agreed to receive offers',DB.customers.filter(x=>x.consent===true).length)}${kpi('Campaigns sent',DB.campaigns.length)}${kpi('Marketing spend','BDT '+fmt(bal('5400')),'Accounting')}</div>`
  +`<h3>1. Choose the audience from Sales data</h3><div class="form">Segment ${sel('ks',Object.keys(SEGS).map(k=>[k,SEGS[k][0]+' ('+st.filter(SEGS[k][1]).length+')']),c.seg,"cmpSet('seg',this.value)")} Channel ${sel('kc',['Email','SMS','WhatsApp'].map(x=>[x,x]),c.ch,"cmpSet('ch',this.value)")}</div>`
  +tbl(['Customer','Type','Orders','Spend incl. VAT','Last order','Bought through','Contact','Consent','In this campaign',''],p.mem.map(s=>[esc(s.c.name),s.c.type||'B2C',s.n,fmt(s.spend),s.last?s.last+' ('+s.days+' days ago)':'Never',s.ch.map(x=>ch[x]||x).join(', ')||'-',esc([s.c.email,s.c.phone].filter(Boolean).join(' ')||'-'),s.c.consent===true?'Yes':'No',
     s.c.consent!==true?'<span class="warn">No consent</span>':!(c.ch==='Email'?s.c.email:s.c.phone)?'<span class="warn">No '+(c.ch==='Email'?'email address':'phone number')+'</span>':'<span class="good">Yes</span>',
     `<button class="${s.c.consent===true?'x':''}" onclick="toggleConsent('${s.c.id}')">${s.c.consent===true?'Withdraw consent':'Record consent'}</button>`]))
  +`<h3>2. Write the message</h3><div class="form">Template ${sel('kt',Object.keys(TPL).map(k=>[k,TPL[k][0]]),c.tpl,"cmpSet('tpl',this.value)")}<input id="ko" value="${esc(c.offer)}" placeholder="Offer" aria-label="Offer" style="width:90px" onchange="cmpSet('offer',this.value)"><input id="kn" value="${esc(c.name)}" placeholder="Campaign name" aria-label="Campaign name" style="min-width:220px" onchange="cmpSet('name',this.value)"></div>`
  +`<textarea id="kb" aria-label="Message text" onchange="cmpSet('body',this.value)">${esc(c.body)}</textarea>`
  +`<h3>3. Check and send</h3><p>${p.ok.length} of ${p.mem.length} customers in this segment can be reached.${p.noConsent?' '+p.noConsent+' without consent.':''}${p.noContact?' '+p.noContact+' without the contact detail this channel needs.':''} Estimated cost: BDT ${fmt(p.cost)} (fixed BDT ${fmt(FIXED[c.ch])} plus BDT ${fmt(COST[c.ch])} per message${c.ch==='SMS'?' part':''}${c.ch==='SMS'&&p.ok.length?', '+p.parts+' part'+(p.parts>1?'s':'')+' each':''}).</p>`

  +'<h3>Results</h3>'+tbl(['Campaign','Name','Channel','Segment','Sent','Delivered','Opened or read','Clicked','Cost','Orders since','Revenue since','Revenue per BDT 1 spent',''],results)+detail; };

/* company.js – LIMITED COMPANY MODULE
   Share capital and shareholder register, income tax provision, dividends, fixed assets with depreciation,
   board resolutions, equity summary and key ratios. Everything posts to the same ledger with post(). */
TABS.splice(TABS.indexOf('Accounting')+1,0,'Company');
const coGuard=()=>{ guard(); if(!['Owner','Accountant'].includes(USER.role)) throw new Error('Only the Owner or Accountant can do this.'); };
const shares=()=>DB.shareholders.reduce((s,h)=>s+h.shares,0);
const profitNow=()=>rev()-expenses()-bal('3030');                       // profit after tax so far (revenue less every 5xxx account)
const addAccts=[['1500','Fixed Assets (cost)'],['1590','Accumulated Depreciation'],['2200','Income Tax Payable'],['2300','Dividends Payable'],['3020','Dividends Declared'],['5600','Income Tax Expense'],['5700','Depreciation Expense']];
function migrateCo(){ ['shareholders','resolutions','assets','depMonths'].forEach(c=>{ if(!Array.isArray(DB[c])) DB[c]=[]; });
  if(!DB.company) DB.company={fv:100,authorised:10000,taxRate:27.5};   // face value BDT 100; authorised capital in shares
  addAccts.forEach(a=>{ if(!DB.accounts.some(x=>x[0]===a[0])) DB.accounts.push(a.slice()); }); DB.accounts.sort((a,b)=>a[0]<b[0]?-1:1);
  const sc=DB.accounts.find(a=>a[0]==='3010'); if(sc) sc[1]='Share Capital';
  if(!DB.shareholders.length){ const n=Math.max(0,Math.round(-bal('3010')/DB.company.fv)), a=Math.round(n*.6), b=Math.round(n*.25);   // opening capital split among three directors
    [['Rupa Akter (Managing Director)',a],['Karim Hossain (Director)',b],['Sadia Rahman (Director)',n-a-b]].forEach((h,i)=>DB.shareholders.push({id:'SH-000'+(i+1),name:h[0],shares:h[1]})); DB.seq.SH=3; }
  save(); }
const resolve=(topic,decision)=>create('resolutions',{date:today(),topic,decision},'RES');
function issueShares(){ run(()=>{ coGuard(); const nm=v('cn').trim(), q=Math.floor(+v('cq')); if(nm.length<2||!(q>0)) throw new Error('Enter the shareholder name and a number of shares.');
  if(shares()+q>DB.company.authorised) throw new Error('This exceeds authorised capital of '+DB.company.authorised+' shares. Authorised capital must first be increased by a shareholders resolution.');
  const amt=r2(q*DB.company.fv), h=DB.shareholders.find(x=>x.name.toLowerCase()===nm.toLowerCase());
  if(h) update('shareholders',h.id,{shares:h.shares+q}); else create('shareholders',{name:nm,shares:q},'SH');
  post(today(),'Shares issued to '+nm+' ('+q+' x BDT '+DB.company.fv+')',[['1010',amt,0],['3010',0,amt]],{doc:'Share issue'}); resolve('Allotment of shares',q+' shares allotted to '+nm+' at face value, BDT '+fmt(amt)); }); }
function provideTax(){ run(()=>{ coGuard(); const rate=+v('tr'), pbt=rev()-expenses()+bal('5600'); if(!(rate>0&&rate<=50)) throw new Error('Enter a tax rate between 0 and 50.'); if(pbt<=0) throw new Error('There is no profit to tax yet.');
  const due=r2(pbt*rate/100-bal('5600')); if(due<=0.005) throw new Error('Tax is already provided for the profit so far.'); DB.company.taxRate=rate;
  post(today(),'Income tax provision at '+rate+'% of profit before tax',[['5600',due,0],['2200',0,due]],{doc:'Tax provision'}); }); }
function payTax(){ run(()=>{ coGuard(); const a=r2(-bal('2200')); if(a<=0.005) throw new Error('No income tax is payable.'); post(today(),'Income tax paid',[['2200',a,0],['1010',0,a]],{doc:'Tax payment'}); }); }
function declareDividend(){ run(()=>{ coGuard(); const dps=+v('dp'), tot=r2(dps*shares()), avail=r2(profitNow()-bal('3020')); if(!(dps>0)) throw new Error('Enter a dividend per share.');
  if(!$('#da').checked) throw new Error('Tick the box to confirm the shareholders approved the dividend at the AGM.');
  if(tot>avail) throw new Error('A dividend of BDT '+fmt(tot)+' is more than the profit available, BDT '+fmt(Math.max(0,avail))+'. A company pays dividends only out of profits.');
  post(today(),'Dividend declared, BDT '+dps+' per share',[['3020',tot,0],['2300',0,tot]],{doc:'Dividend'}); resolve('Dividend','Dividend of BDT '+dps+' per share (BDT '+fmt(tot)+') recommended by the board and approved at the AGM'); }); }
function payDividend(){ run(()=>{ coGuard(); const a=r2(-bal('2300')); if(a<=0.005) throw new Error('No dividend is payable.'); post(today(),'Dividend paid to shareholders',[['2300',a,0],['1010',0,a]],{doc:'Dividend payment'}); }); }
function buyAsset(){ run(()=>{ coGuard(); const nm=v('an').trim(), c=+v('ac'), y=Math.floor(+v('ay')); if(nm.length<2||!(c>0)||!(y>0)) throw new Error('Enter the asset name, its cost and its useful life in years.');
  create('assets',{name:nm,cost:c,life:y,date:today(),dep:0},'FA'); post(today(),'Purchase of fixed asset: '+nm,[['1500',c,0],['1010',0,c]],{doc:'Asset'}); }); }
function runDep(){ run(()=>{ coGuard(); const m=today().slice(0,7); if(DB.depMonths.includes(m)) throw new Error('Depreciation for '+m+' is already posted.'); let tot=0;
  DB.assets.forEach(a=>{ const d=r2(Math.min(a.cost/a.life/12,a.cost-a.dep)); if(d>0){ update('assets',a.id,{dep:r2(a.dep+d)}); tot+=d; } }); tot=r2(tot); if(tot<=0) throw new Error('There is no asset to depreciate.');
  DB.depMonths.push(m); post(today(),'Depreciation for '+m+' (straight line)',[['5700',tot,0],['1590',0,tot]],{doc:'Depreciation '+m}); }); }
function addRes(){ run(()=>{ coGuard(); const t=v('rt').trim(), d=v('rd').trim(); if(t.length<3||d.length<5) throw new Error('Enter the topic and the decision.'); resolve(t,d); }); }
VIEWS.Company=()=>{ const fv=DB.company.fv, n=shares(), cap=-bal('3010'), np=profitNow(), pbt=rev()-expenses()+bal('5600'), div=bal('3020'), avail=Math.max(0,r2(np-div)), eq=cap+np-div, R=rev(),
  CA=['1010','1020','1030','1040','1050','1100','1200','1210'].reduce((s,c)=>s+bal(c),0), CL=DB.accounts.filter(a=>a[0][0]==='2').reduce((s,a)=>s-bal(a[0]),0), taxDue=r2(-bal('2200')), divDue=r2(-bal('2300')),
